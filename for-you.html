<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./for-you.css" />
    <title>Summarist • For You</title>
  </head>
  <body>
    <div class="wrapper">
      <aside class="sidebar">
        <a class="sidebar__logo" href="./index.html">
          <img src="./assets/logo.png" alt="Summarist logo" />
        </a>
        <nav class="sidebar__links">
          <a class="sidebar__link sidebar__link--active" href="./for-you.html">For you</a>
          <a class="sidebar__link" href="#">My Library</a>
          <a class="sidebar__link sidebar__link--disabled" href="#">Highlights</a>
          <a class="sidebar__link" href="./search.html">Search</a>
        </nav>
        <div class="sidebar__bottom">
          <a class="sidebar__link" href="./settings.html">Settings</a>
          <button class="sidebar__link sidebar__button" id="logoutBtn" type="button">Logout</button>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <div class="topbar__input--wrapper">
            <input class="topbar__input" id="topSearchInput" type="text" placeholder="Search for books" />
          </div>
        </header>

        <div class="row">
          <div class="container">
            <div class="for-you__wrapper">
              <section>
                <h2 class="for-you__title">Selected just for you</h2>
                <div id="selectedBookContainer" class="selected__book--skeleton skeleton-card">
                  <div class="skeleton skeleton-line skeleton-w-40"></div>
                  <div class="skeleton skeleton-line skeleton-w-70"></div>
                  <div class="skeleton skeleton-line skeleton-w-35"></div>
                </div>
              </section>

              <section>
                <h2 class="for-you__title">Recommended For You</h2>
                <p class="for-you__sub--title">We think you’ll like these</p>
                <div id="recommendedBooksContainer" class="for-you__recommended--books">
                  <div class="recommended__books--skeleton">
                    <div class="skeleton skeleton-thumb"></div>
                    <div class="skeleton skeleton-line"></div>
                    <div class="skeleton skeleton-line skeleton-w-80"></div>
                    <div class="skeleton skeleton-line skeleton-w-60"></div>
                  </div>
                  <div class="recommended__books--skeleton">
                    <div class="skeleton skeleton-thumb"></div>
                    <div class="skeleton skeleton-line"></div>
                    <div class="skeleton skeleton-line skeleton-w-80"></div>
                    <div class="skeleton skeleton-line skeleton-w-60"></div>
                  </div>
                  <div class="recommended__books--skeleton">
                    <div class="skeleton skeleton-thumb"></div>
                    <div class="skeleton skeleton-line"></div>
                    <div class="skeleton skeleton-line skeleton-w-80"></div>
                    <div class="skeleton skeleton-line skeleton-w-60"></div>
                  </div>
                </div>
              </section>

              <section>
                <h2 class="for-you__title">Suggested Books</h2>
                <p class="for-you__sub--title">Browse those books</p>
                <div id="suggestedBooksContainer" class="for-you__recommended--books">
                  <div class="recommended__books--skeleton">
                    <div class="skeleton skeleton-thumb"></div>
                    <div class="skeleton skeleton-line"></div>
                    <div class="skeleton skeleton-line skeleton-w-80"></div>
                    <div class="skeleton skeleton-line skeleton-w-60"></div>
                  </div>
                  <div class="recommended__books--skeleton">
                    <div class="skeleton skeleton-thumb"></div>
                    <div class="skeleton skeleton-line"></div>
                    <div class="skeleton skeleton-line skeleton-w-80"></div>
                    <div class="skeleton skeleton-line skeleton-w-60"></div>
                  </div>
                  <div class="recommended__books--skeleton">
                    <div class="skeleton skeleton-thumb"></div>
                    <div class="skeleton skeleton-line"></div>
                    <div class="skeleton skeleton-line skeleton-w-80"></div>
                    <div class="skeleton skeleton-line skeleton-w-60"></div>
                  </div>
                </div>
              </section>
            </div>
          </div>
        </div>
      </main>
    </div>

    <script type="module" src="./for-you.js"></script>
  </body>
</html>
